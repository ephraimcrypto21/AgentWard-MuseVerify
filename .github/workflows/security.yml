name: Security boundaries
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
      - run: ruff check --select E9,F63,F7,F82,F401 . --exclude venv,worktrees,patches,reports
      - run: python -m pip check
      - run: docker build -t agentward-sandbox:ci -f security/Dockerfile.sandbox .
      - run: python -m unittest tests.test_docker_security -v
        env:
          AGENTWARD_TEST_DOCKER: '1'
          SANDBOX_IMAGE: agentward-sandbox:ci
